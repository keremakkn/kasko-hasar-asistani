# Kasko Hasar Ön Değerlendirme Asistanı: ayarlar tek yerde

belgeler:
  genel_sartlar:
    dosya: data/kaynak/kasko_genel_sartlar_tsb.pdf
    ad: Kara Araçları Kasko Sigortası Genel Şartları
    kisa: GS
    urun: hepsi                 # genel şartlar her kasko poliçesine uygulanır
    kaynak_url: https://www.tsb.org.tr/content/Legislations/Kara_Araclar%C4%B1_Kasko_Sigortas%C4%B1_Genel_Sartlar%C4%B1.pdf
    not: 01.04.2013'te yürürlüğe girdi; 2015/20 sektör duyurusundaki değişiklikler (B.3 3.3.1.1, 3.3.2.2, C.7) metne işlenmiş
  benim_kaskom:
    dosya: data/kaynak/referans_benim_kaskom_ozel.pdf
    ad: Benim Kaskom Sigortası Özel Şartları
    kisa: BK
    urun: benim_kaskom
    kaynak_url: https://referanssigorta.net/upload/admin/genel-sartlar/Benim-Kaskom-Ozel-Sartlar.pdf
  benim_uygun_kaskom:
    dosya: data/kaynak/referans_benim_uygun_kaskom_ozel.pdf
    ad: Benim Uygun Kaskom Sigortası Özel Şartları
    kisa: BUK
    urun: benim_uygun_kaskom
    kaynak_url: https://referanssigorta.net/upload/admin/genel-sartlar/Benim-Uygun-Kaskom-Ozel-Sartlar.pdf

arama:
  embedding_model: intfloat/multilingual-e5-base   # Türkçe destekli, yerel, ücretsiz; 512 token okur
  chroma_dir: data/chroma
  koleksiyon: kasko_sartlar_e5
  parca_token: 350        # model sınırı 512; başlık ve "passage: " öneki için pay
  sonuc_sayisi: 6
  rrf_k: 60               # Reciprocal Rank Fusion sabiti
  min_benzerlik: 0.80     # altı ve kelime eşleşmesi de yoksa "bulunamadı" (eşik ölçülüp ayarlanacak)
