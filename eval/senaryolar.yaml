  beklenen: {etiket: kapsam_disi, risk: [CALINMA]}

- id: ayse_anahtar
  amac: Anahtarın ele geçirilmesiyle çalınma, polise bildirilmiş -> kapsamda
  police_no: RS-K-2026-000101
  ihbar: 3 Kasım'da kafede masada unuttuğum anahtarımı alıp otoparktaki aracımı çalmışlar. Aynı gün polise bildirdim.
  beklenen: {etiket: kapsamda, risk: [ANAHTAR_ELE_GECIRILMESI|CALINMA], atif: [BK_arac-anahtarinin-ele-gecirilmesi-nedeniyle-aracin_1|BK_arac-anahtarinin-ele-gecirilmesi-nedeniyle-aracin_2|GS_A.4_4.11]}

- id: ayse_kotu_niyet
  amac: Park hâlinde çizme/ayna kırma, karakola bildirilmiş
  police_no: RS-K-2026-000101
  ihbar: Dün gece park halindeki aracımı birileri anahtarla çizmiş, yan aynasını da kırmışlar. Sabah karakola gidip bildirdim.
  beklenen: {etiket: kapsamda, risk: [UCUNCU_KISI_KOTU_NIYET], atif: [BK_ucuncu-kisilerin-kotu-niyetli-hareketleri-teminati_1], sorulmamali: [alkol]}

- id: burak_dolu
