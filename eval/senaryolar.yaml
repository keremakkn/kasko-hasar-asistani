# Uçtan uca değerlendirme seti. İhbar tarihi (aksi yazılmadıkça) 2026-11-07.
# "A|B" = ikisinden biri yeterli. sorulmali/sorulmamali: acente sorularında aranan anahtar kelimeler.

- id: mehmet_sel_park
  amac: Park hâlinde sel -> teminat var, muafiyet bilgisi, alkol/ehliyet SORULMAZ
  police_no: RS-K-2026-000102
  ihbar: Dün gece sağanak yağmurda araç sokakta park halindeydi, sabah baktığımda motor bölmesine kadar su dolmuştu.
  beklenen: {etiket: kapsamda, risk: [SEL_SU_BASKINI], atif: [BUK_sel-ve-su-baskini-klozu_1|GS_A.4_4.5], sorulmamali: [alkol, ehliyet]}

- id: mehmet_sel_tarihsiz
  amac: Tarih yok -> ek bilgi; tarih sorulur, alkol sorulmaz
  police_no: RS-K-2026-000102
  ihbar: Sağanak yağmurda araç sokakta park halindeydi, sabah baktığımda motor bölmesine kadar su dolmuştu.
  beklenen: {etiket: ek_bilgi, risk: [SEL_SU_BASKINI], sorulmali: [tarih], sorulmamali: [alkol]}

