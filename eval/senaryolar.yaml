  beklenen: {etiket: ek_bilgi, risk: [SEL_SU_BASKINI], sorulmali: [alkol]}

- id: ayse_carpip_kacma_tarihsiz
  amac: Park hâlinde çarpılmış, tarih belirsiz -> tarih sorulur, alkol sorulmaz
  police_no: RS-K-2026-000101
  ihbar: Geçenlerde park halindeyken birisi aracıma çarpıp kaçmış, arka kapı göçmüş.
  beklenen: {etiket: ek_bilgi, risk: [CARPISMA|UCUNCU_KISI_KOTU_NIYET], sorulmali: [tarih], sorulmamali: [alkol]}

- id: zeynep_cam
  amac: Cam teminatı var; sürüş sırasında olduğu için sürüş soruları
