  beklenen: {etiket: uzman, risk: [CARPISMA], atif: [BUK_lpg-ile-calisan-araclar-klozu_1]}

- id: elif_suresi_dolmus
  amac: Poliçe 15.10.2026'da bitmiş, olay 3 Kasım
  police_no: RS-K-2025-000105
  ihbar: 3 Kasım'da AVM otoparkından çıkarken direğe sürttüm, sağ çamurluk ezildi.
  beklenen: {etiket: kapsam_disi, risk: [CARPISMA], atif: [GS_A.8_giris]}

- id: elif_bitis_gunu
  amac: Olay bitiş gününde -> öğle 12.00 kuralı, saat sorulur
  police_no: RS-K-2025-000105
  ihbar: 15 Ekim 2026 günü AVM otoparkından çıkarken direğe sürttüm, sağ çamurluk ezildi.
  beklenen: {etiket: ek_bilgi, risk: [CARPISMA], atif: [GS_A.8_giris], sorulmali: [saat]}

- id: burak_kardes
  amac: Sürücü kısıtı ihlali; ehliyet de sorulmalı
  police_no: RS-K-2026-000106
  ihbar: Dün akşam Gebze'de kavşakta önümdeki araç ani fren yaptı, arkadan çarptık. Ön tampon ve far kırıldı. O sırada aracı kardeşim kullanıyordu, ben yanında oturuyordum.
  beklenen: {etiket: uzman, risk: [CARPISMA], sorulmali: [yetkili sürücü, ehliyet]}

- id: burak_esi
  amac: Eşi kullanıyor -> sürücü uygun; kalan bilgiler tam
  police_no: RS-K-2026-000106
  ihbar: Dün akşam aracımı eşim kullanırken park ederken duvara sürttü, arka tampon çizildi. Eşimin ehliyeti var, alkol almamıştı, olay yerinden ayrılmadı ve karakola gidip tutanak tutturduk.
  beklenen: {etiket: kapsamda, risk: [CARPISMA], sorulmamali: [yetkili sürücü]}

- id: ayse_alkol_terk
  amac: Alkol ve olay yerini terk -> iki istisna işareti
  police_no: RS-K-2026-000101
  ihbar: 7 Kasım gecesi arkadaşlarla içtikten sonra eve dönerken direğe çarptım. Kimse yoktu, polisi beklemeden eve gittim.
  beklenen: {etiket: uzman, risk: [CARPISMA], atif: [GS_A.5_5.5, GS_A.5_5.10], sorulmali: [zorunlu]}

- id: ayse_ehliyetsiz
  amac: Ehliyetsiz sürücü (oğlu) -> A.5/5.4
  police_no: RS-K-2026-000101
  ihbar: Dün oğlum ehliyeti olmadığı halde aracı alıp çıkmış ve bir duvara çarpmış. Alkol yoktu, olay yerinde bekledi, polis gelip tutanak tuttu.
  beklenen: {etiket: uzman, risk: [CARPISMA], atif: [GS_A.5_5.4]}

- id: ayse_sel_surerken
  amac: Sel ama araç SÜRÜLÜYOR -> sürüşle ilgili sorular bu kez sorulur
